name: Rename website file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename website file to index.html
        run: |
          git config user.name "basharhandyman"
          git config user.email "bashar.mehiar.handyman@gmail.com"
          git mv handyman-services-dmv-website.html index.html
          git commit -m "Rename website file to index.html"
          git push
